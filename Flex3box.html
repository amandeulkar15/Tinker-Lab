<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOX</title>

  <style>
    @media screen and (min-width: 600px) {}

    .BOX {
      background-color: lightpink;
      padding: 20px;
      width: 200px;
      margin: 30px;
    }

    .cont {
       display: grid;
	grid-template-columns: 2fr 2fr 1fr;
    }

    h2 {
      color: red;
    }
  </style>

</head>

<body>
  <h2>SIT NAGPUR</h2>
  <img src="https://sitnagpur.edu.in/images/infra2.webp" height="200" width="400" alt="SIT Nagpur">

  <div class="cont">
    <div class="BOX">
      WELCOME TO SIT
    </div>

    <div class="BOX" style="background-color: teal;">
      THIS IS AFFILIATED TO SIU
    </div>

    <div class="BOX" style="background-color: khaki;">
      INLINE
    </div>

    <div class="BOX" style="background-color: coral; color: white;">
      EXTERNAL
    </div>

    <div class="BOX" style="background-color: aqua;">
      INTERNAL
    </div>

  </div>

</body>
</html>
